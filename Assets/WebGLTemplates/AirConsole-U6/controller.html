<html>
<head>
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <script src="https://www.airconsole.com/api/airconsole-1.10.0.js"></script>
    <style type="text/css">
        /* --- LAYOUT & BASE STYLES --- */
        body {
            background-color: #222;
            margin: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            color: white;
            user-select: none;
            touch-action: none; /* Crucial: Stops the phone screen from trying to scroll/zoom */
        }

        .column {
            width: 33.33vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: width 0.2s; /* Smooth UI swaps */
        }

        #col-right {
            flex-direction: column;
            justify-content: space-evenly;
        }

        /* --- LOBBY UI --- */
        #lobby-ui {
            display: flex;
            position: absolute;
            inset: 0;
            background-color: #2c3e50;
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #start-match-btn {
            width: 60vw;
            height: 20vh;
            background-color: #27ae60;
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 28px;
            font-weight: bold;
            margin-top: 20px;
        }

            #start-match-btn:active {
                background-color: #2ecc71;
            }

        /* --- JOYSTICK UI --- */
        #joystick-zone {
            width: 140px;
            height: 140px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #joystick-nub {
            width: 60px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
            transition: transform 0.05s linear;
        }

        /* --- BUTTON UI --- */
        #dash-btn {
            width: 110px;
            height: 110px;
            background-color: #e74c3c;
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 22px;
            font-weight: bold;
            transition: all 0.2s;
        }

            #dash-btn:active {
                background-color: #c0392b;
            }

        .y-btn {
            width: 85%;
            height: 42vh;
            background-color: #3498db;
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
    </style>

    <script type="text/javascript">
        var airconsole;
        var currentX = 0, currentY = 0, currentZ = 0;
        var lastSentX = 0, lastSentY = 0, lastSentZ = 0;

        var dashBtn, upBtn, downBtn, joyZone, joyNub;

        function App() {
            airconsole = new AirConsole({ "orientation": "landscape" });

            dashBtn = document.getElementById("dash-btn");
            upBtn = document.getElementById("up-btn");
            downBtn = document.getElementById("down-btn");
            joyZone = document.getElementById("joystick-zone");
            joyNub = document.getElementById("joystick-nub");

            SetupNetworkListeners();
            SetupEventBindings();

            setInterval(function () {
                if (currentX !== lastSentX || currentY !== lastSentY || currentZ !== lastSentZ) {
                    airconsole.message(AirConsole.SCREEN, { "x": currentX, "y": currentY, "z": currentZ });
                    lastSentX = currentX; lastSentY = currentY; lastSentZ = currentZ;
                }
            }, 50);
        }

        function SetupNetworkListeners() {
            airconsole.onMessage = function (from, data) {
                if (!data.gameState) return;

                if (data.gameState === "Lobby") {
                    SetLobbyUI();
                } else if (data.gameState === "Clash") {
                    // Safe parsing to prevent ID mismatch errors
                    var myId = parseInt(airconsole.getDeviceId());
                    var isInClash = data.clashingIDs && data.clashingIDs.some(id => parseInt(id) === myId);

                    if (isInClash) SetClashUI();
                    else SetNormalUI();
                } else {
                    SetNormalUI();
                }
            };
        }

        function SetLobbyUI() {
            document.getElementById("lobby-ui").style.display = "flex";
        }

        function SetNormalUI() {
            document.getElementById("lobby-ui").style.display = "none";

            // Restore normal column layout
            document.getElementById("col-left").style.display = "flex";
            document.getElementById("col-right").style.display = "flex";
            document.getElementById("col-center").style.width = "33.33vw";

            // Restore Dash Button
            dashBtn.innerText = "DASH";
            dashBtn.style.width = "110px";
            dashBtn.style.height = "110px";
            dashBtn.style.borderRadius = "50%";
        }

        function SetClashUI() {
            // Completely hide the other columns so they don't block taps
            document.getElementById("col-left").style.display = "none";
            document.getElementById("col-right").style.display = "none";
            document.getElementById("col-center").style.width = "100vw";

            // Expand Mash Button
            dashBtn.innerText = "MASH!";
            dashBtn.style.width = "80vw";
            dashBtn.style.height = "80vh";
            dashBtn.style.borderRadius = "20px";
        }

        function calculateJoystickMath(clientX, clientY) {
            var rect = joyZone.getBoundingClientRect();
            if (rect.width === 0) return;

            var rawX = ((clientX - rect.left) / rect.width) * 2 - 1;
            var rawZ = -(((clientY - rect.top) / rect.height) * 2 - 1);

            currentX = isNaN(rawX) ? 0 : Math.max(-1, Math.min(1, rawX));
            currentZ = isNaN(rawZ) ? 0 : Math.max(-1, Math.min(1, rawZ));

            joyNub.style.transform = `translate(${currentX * 40}px, ${-currentZ * 40}px)`;
        }

        function resetJoystick() {
            currentX = 0; currentZ = 0;
            joyNub.style.transform = `translate(0px, 0px)`;
        }
        function setVertical(value) { currentY = value; }

        function SetupEventBindings() {
            // 1. Lobby & Dash (Basic taps)
            document.getElementById("start-match-btn").addEventListener("pointerdown", function () {
                airconsole.message(AirConsole.SCREEN, { "action": "startGame" });
            });
            dashBtn.addEventListener("pointerdown", function () {
                airconsole.message(AirConsole.SCREEN, { "dash": true, "mash": true });
            });

            // 2. Vertical Controls (Manually enforcing colors for visual feedback)
            upBtn.addEventListener("pointerdown", function () { setVertical(1); upBtn.style.backgroundColor = "#2980b9"; });
            upBtn.addEventListener("pointerup", function () { setVertical(0); upBtn.style.backgroundColor = "#3498db"; });
            upBtn.addEventListener("pointerleave", function () { setVertical(0); upBtn.style.backgroundColor = "#3498db"; });

            downBtn.addEventListener("pointerdown", function () { setVertical(-1); downBtn.style.backgroundColor = "#2980b9"; });
            downBtn.addEventListener("pointerup", function () { setVertical(0); downBtn.style.backgroundColor = "#3498db"; });
            downBtn.addEventListener("pointerleave", function () { setVertical(0); downBtn.style.backgroundColor = "#3498db"; });

            // 3. Joystick (Using setPointerCapture so it doesn't break if thumb slides off screen)
            var isDragging = false;
            joyZone.addEventListener("pointerdown", function (e) {
                isDragging = true;
                joyZone.setPointerCapture(e.pointerId);
                calculateJoystickMath(e.clientX, e.clientY);
            });
            joyZone.addEventListener("pointermove", function (e) {
                if (isDragging) calculateJoystickMath(e.clientX, e.clientY);
            });
            joyZone.addEventListener("pointerup", function (e) {
                isDragging = false;
                joyZone.releasePointerCapture(e.pointerId);
                resetJoystick();
            });
            joyZone.addEventListener("pointercancel", function () {
                isDragging = false;
                resetJoystick();
            });
        }
    </script>
</head>

<body onload="window.app = new App()">

    <div id="lobby-ui">
        <h2 id="lobby-status">Waiting for players...</h2>
        <button id="start-match-btn">START MATCH</button>
    </div>

    <div id="col-left" class="column">
        <div id="joystick-zone"><div id="joystick-nub"></div></div>
    </div>

    <div id="col-center" class="column">
        <button id="dash-btn">DASH</button>
    </div>

    <div id="col-right" class="column">
        <button id="up-btn" class="y-btn">UP</button>
        <button id="down-btn" class="y-btn">DOWN</button>
    </div>

</body>
</html>
