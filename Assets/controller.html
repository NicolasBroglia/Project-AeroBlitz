<html>
	<head>
		<meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
		<script src="https://www.airconsole.com/api/airconsole-1.10.0.js"></script>
		<style type="text/css">
			body {
			background-color: #222;
			margin: 0;
			display: flex;
			justify-content: space-between;
			align-items: center;
			height: 100vh;
			font-family: sans-serif;
			color: white;
			user-select: none;
			}

			.column {
			width: 33.33vw;
			height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			}

			#joystick-zone {
			width: 140px;
			height: 140px;
			background: rgba(255, 255, 255, 0.1);
			border-radius: 50%;
			display: flex;
			justify-content: center;
			align-items: center;
			position: relative;
			}

			#joystick-nub {
			width: 60px;
			height: 60px;
			background-color: rgba(255, 255, 255, 0.6);
			border-radius: 50%;
			position: absolute;
			pointer-events: none;
			transition: transform 0.05s linear;
			}

			#dash-btn {
			width: 110px;
			height: 110px;
			background-color: #e74c3c;
			border: none;
			border-radius: 50%;
			color: white;
			font-size: 22px;
			font-weight: bold;
			}
			#dash-btn:active { background-color: #c0392b; }

			#vertical-controls {
			flex-direction: column;
			justify-content: space-evenly;
			}

			.y-btn {
			width: 85%;
			height: 42vh;
			background-color: #3498db;
			border: none;
			border-radius: 15px;
			color: white;
			font-size: 24px;
			font-weight: bold;
			}
			.y-btn:active { background-color: #2980b9; }
		</style>
		<script type="text/javascript">
			var airconsole;
			var currentX = 0;
			var currentZ = 0;
			var currentY = 0;

			function App() {
			airconsole = new AirConsole({ "orientation": "landscape" });

			var dashBtn = document.getElementById("dash-btn");
			var upBtn = document.getElementById("up-btn");
			var downBtn = document.getElementById("down-btn");
			var joyZone = document.getElementById("joystick-zone");
			var joyNub = document.getElementById("joystick-nub");

			function calculateJoystickMath(clientX, clientY) {
			var rect = joyZone.getBoundingClientRect();
			var rawX = ((clientX - rect.left) / rect.width) * 2 - 1;
			var rawZ = -(((clientY - rect.top) / rect.height) * 2 - 1);

			currentX = Math.max(-1, Math.min(1, rawX));
			currentZ = Math.max(-1, Math.min(1, rawZ));

			joyNub.style.transform = `translate(${currentX * 40}px, ${-currentZ * 40}px)`;
			sendInput();
			}

			function resetJoystick() {
			currentX = 0;
			currentZ = 0;
			joyNub.style.transform = `translate(0px, 0px)`;
			sendInput();
			}

			// --- TOUCH EVENTS ---
			dashBtn.addEventListener("touchstart", function(e) { e.preventDefault(); airconsole.message(AirConsole.SCREEN, { "dash": true }); });

			upBtn.addEventListener("touchstart", function(e) { e.preventDefault(); currentY = 1; sendInput(); });
			upBtn.addEventListener("touchend", function(e) { e.preventDefault(); currentY = 0; sendInput(); });

			downBtn.addEventListener("touchstart", function(e) { e.preventDefault(); currentY = -1; sendInput(); });
			downBtn.addEventListener("touchend", function(e) { e.preventDefault(); currentY = 0; sendInput(); });

			// The fix: Added touchstart to stop the browser from scrolling
			joyZone.addEventListener("touchstart", function(e) {
			e.preventDefault();
			calculateJoystickMath(e.touches[0].clientX, e.touches[0].clientY);
			});

			joyZone.addEventListener("touchmove", function(e) {
			e.preventDefault();
			calculateJoystickMath(e.touches[0].clientX, e.touches[0].clientY);
			});

			joyZone.addEventListener("touchend", function(e) {
			e.preventDefault();
			resetJoystick();
			});

			// The safety net: Catch browser interruptions
			joyZone.addEventListener("touchcancel", function(e) {
			e.preventDefault();
			resetJoystick();
			});

			// --- PC MOUSE EVENTS ---
			var isDragging = false;

			joyZone.addEventListener("mousedown", function(e) {
			isDragging = true;
			calculateJoystickMath(e.clientX, e.clientY);
			});

			window.addEventListener("mousemove", function(e) {
			if (isDragging) calculateJoystickMath(e.clientX, e.clientY);
			});

			window.addEventListener("mouseup", function(e) {
			if (isDragging) {
			isDragging = false;
			resetJoystick();
			}
			});

			dashBtn.addEventListener("mousedown", function() { airconsole.message(AirConsole.SCREEN, { "dash": true }); });

			upBtn.addEventListener("mousedown", function() { currentY = 1; sendInput(); });
			upBtn.addEventListener("mouseup", function() { currentY = 0; sendInput(); });

			downBtn.addEventListener("mousedown", function() { currentY = -1; sendInput(); });
			downBtn.addEventListener("mouseup", function() { currentY = 0; sendInput(); });
			}

			// --- RATE LIMITER VARIABLES ---
			var lastSendTime = 0;
			var sendDelay = 40; // 40ms = approx 25 updates per second

			function sendInput() {
			if (!airconsole) return;

			var now = Date.now();

			// We ALWAYS want to send the message instantly if the player let go of the controls
			var isStopping = (currentX === 0 && currentY === 0 && currentZ === 0);

			// Only send data if it's a STOP command, OR if 40 milliseconds have passed
			if (isStopping || (now - lastSendTime > sendDelay)) {
			airconsole.message(AirConsole.SCREEN, {
			"x": currentX,
			"y": currentY,
			"z": currentZ
			});
			lastSendTime = now;
			}
			}
		</script>
	</head>
	<body onload="window.app = new App()">
		<div class="column">
			<div id="joystick-zone">
				<div id="joystick-nub"></div>
			</div>
		</div>
		<div class="column">
			<button id="dash-btn">DASH</button>
		</div>
		<div id="vertical-controls" class="column">
			<button id="up-btn" class="y-btn">UP</button>
			<button id="down-btn" class="y-btn">DOWN</button>
		</div>
	</body>
</html>
