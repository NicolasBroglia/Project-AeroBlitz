<html>
	<head>
		<meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
		<script src="https://www.airconsole.com/api/airconsole-1.10.0.js"></script>
		<style type="text/css">
			body {
			background-color: #222;
			margin: 0;
			display: flex;
			justify-content: space-between;
			align-items: center;
			height: 100vh;
			font-family: sans-serif;
			color: white;
			user-select: none;
			}

			/* --- NEW 3-COLUMN LAYOUT --- */
			.column {
			width: 33.33vw; /* Exactly 1/3 of the screen width */
			height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			}

			/* --- LEFT COLUMN --- */
			#joystick-zone {
			width: 140px;
			height: 140px;
			background: rgba(255, 255, 255, 0.1);
			border-radius: 50%;
			display: flex;
			justify-content: center;
			align-items: center;
			text-align: center;
			}

			/* --- CENTER COLUMN --- */
			#dash-btn {
			width: 110px;
			height: 110px;
			background-color: #e74c3c;
			border: none;
			border-radius: 50%;
			color: white;
			font-size: 22px;
			font-weight: bold;
			}
			#dash-btn:active { background-color: #c0392b; }

			/* --- RIGHT COLUMN (1/3 of screen) --- */
			#vertical-controls {
			flex-direction: column;
			justify-content: space-evenly; /* Spaces the massive buttons evenly */
			}

			.y-btn {
			width: 85%; /* Fills 85% of its 1/3 screen column */
			height: 42vh; /* Fills almost half the vertical screen height per button */
			background-color: #3498db;
			border: none;
			border-radius: 15px;
			color: white;
			font-size: 24px;
			font-weight: bold;
			}
			.y-btn:active { background-color: #2980b9; }
		</style>
		<script type="text/javascript">
			var airconsole;

			// Global state for continuous movement
			var currentX = 0;
			var currentZ = 0;
			var currentY = 0;

			function App() {
			airconsole = new AirConsole({ "orientation": "landscape" });

			// 1. DASH BUTTON (Center)
			var dashBtn = document.getElementById("dash-btn");
			dashBtn.addEventListener("touchstart", function(e) {
			e.preventDefault();
			airconsole.message(AirConsole.SCREEN, { "dash": true });
			});

			// 2. Y-AXIS BUTTONS (Right)
			var upBtn = document.getElementById("up-btn");
			var downBtn = document.getElementById("down-btn");

			upBtn.addEventListener("touchstart", function(e) { e.preventDefault(); currentY = 1; sendInput(); });
			upBtn.addEventListener("touchend", function(e) { e.preventDefault(); currentY = 0; sendInput(); });

			downBtn.addEventListener("touchstart", function(e) { e.preventDefault(); currentY = -1; sendInput(); });
			downBtn.addEventListener("touchend", function(e) { e.preventDefault(); currentY = 0; sendInput(); });

			// 3. JOYSTICK (Left)
			var joyZone = document.getElementById("joystick-zone");
			joyZone.addEventListener("touchmove", function(e) {
			e.preventDefault();
			var touch = e.touches[0];
			var rect = joyZone.getBoundingClientRect();

			var rawX = ((touch.clientX - rect.left) / rect.width) * 2 - 1;
			var rawZ = ((touch.clientY - rect.top) / rect.height) * 2 - 1;

			currentX = Math.max(-1, Math.min(1, rawX));
			currentZ = Math.max(-1, Math.min(1, rawZ));

			sendInput();
			joyZone.innerHTML = "X: " + currentX.toFixed(2);
			});

			joyZone.addEventListener("touchend", function(e) {
			e.preventDefault();
			currentX = 0;
			currentZ = 0;
			sendInput();
			joyZone.innerHTML = "Joystick";
			});
			}

			// Consolidated send function
			function sendInput() {
			if (airconsole) {
			airconsole.message(AirConsole.SCREEN, {
			"x": currentX,
			"y": currentY,
			"z": currentZ
			});
			}
			}
		</script>
	</head>
	<body onload="window.app = new App()">

		<div class="column">
			<div id="joystick-zone">Joystick</div>
		</div>

		<div class="column">
			<button id="dash-btn">DASH</button>
		</div>

		<div id="vertical-controls" class="column">
			<button id="up-btn" class="y-btn">UP</button>
			<button id="down-btn" class="y-btn">DOWN</button>
		</div>

	</body>
</html>
